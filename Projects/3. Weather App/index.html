<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/base.css">
        <!-- leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <!-- -->
        <title>Weather App</title>
    </head>
    <body>
        <div id="app-loader">
            <div class="loader-spinner"></div>
        </div>
        <main>
            <button id="open-locations" class="back-btn">←</button>
            <section id="current-weather"></section>
            <section id="weather-warning"></section>
            <section id="weather-outputs">
                <section id="hour-day-view"></section>
                <section id="forecast"></section>
                <section id="weather-map">
                    <h3>📍 Weather Map</h3>
                    <div id="weather-map-container"></div>
                </section>
                <section id="precipitation-weather"></section>
                <section id="wind-weather"></section>
                <section id="air-quality-weather"></section>
                <section id="uv-index-weather"></section>
                <section id="sun-astrology"></section>
                <section id="moon-astrology"></section>
            </section>

            <section id="attribution">
                <p><a href="https://www.weatherapi.com">Powered by WeatherAPI.com</a></p>
            </section>
        </main>
        <div id="locations-section" class="hidden">
            <div class="locations-header">
                <h2>Weather</h2>
            </div>
            <div class="locations-content">
                <div id="current-location-container">
                    <h3>Current Location</h3>
                </div>
                <div id="saved-locations-container">
                    <h3>Saved Locations</h3>
                </div>
            </div>
            <button id="open-search" class="floating-btn">🔍</button>
        </div>
        <div id="context-menu" class="hidden">
            <button id="move-up-btn">Move Up</button>
            <button id="move-down-btn">Move Down</button>
            <button id="remove-city-btn">Remove City</button>
        </div>
        <div id="search-overlay" class="hidden">
            <div class="search-header">
                <button id="search-back">←</button>
                <input type="text" id="search-input" placeholder="Search location..."/>
            </div>
            <ul id="search-results"></ul>
        </div>
        <script type="module" src="./js/base.js" defer></script>
        <div id="footer">
            <div id="footerContainer">
                <div id="profilePic">
                    <a href="https://www.sololearn.com/Profile/100073"><img id="theImg" src="https://blob.sololearn.com/avatars/4f502f80-c497-49f5-be5b-3ee1f3be0739.jpg"/></a>
                </div>
                <div id="sig">
                    <p><a href="https://www.sololearn.com/Profile/100073">Jacob</a> &copy; 3/12 (2026). Follow me:&nbsp;</p>
                </div>
                <div id="logos">
                    <a href="https://www.sololearn.com/Profile/100073"><img id="slImg" src="https://blob.sololearn.com/avatars/sololearn.png"/></a>
                    <a href="https://codepen.io/JDawson"><img id="cpenImg" src="https://res.cloudinary.com/css-tricks/images/w_600,h_600,c_fill/f_auto,q_auto/v1637703540/Button-White-Large/Button-White-Large-png?_i=AA"/></a>
                    <a href="https://github.com/Jacob-Dawson"><img id="githubImg" src="https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png"/></a>
                </div>
            </div>
        </div>
    </body>
</html>
