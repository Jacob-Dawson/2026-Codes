<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/base.css">
        <!-- leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <!-- -->
        <title>Weather App</title>
    </head>
    <body>
        <main>
            <form id="search-form">
                <input id="city-input" placeholder="Enter city" />
                <ul id="autocomplete"></ul>
                <button>Search</button>
            </form>

            <section id="weather-outputs">
                <section id="location-info"></section>
                <section id="weather-warnings"></section>
                <section id="current-weather"></section>
                <section id="hour-day-view"></section>
                <section id="forecast"></section>
                <section id="weather-map">
                    <h3>📍 Weather Map</h3>
                    <div id="weather-map-container"></div>
                </section>
                <section id="precipitation-weather"></section>
                <section id="wind-weather"></section>
                <section id="air-quality-weather"></section>
                <section id="uv-index-weather"></section>
                <section id="sun-astrology"></section>
                <section id="moon-astrology"></section>
            </section>

            <section id="attribution">
                <p><a href="https://www.weatherapi.com">Powered by WeatherAPI.com</a></p>
            </section>
        </main>
        <script type="module" src="./js/base.js"></script>
        <div id="footer">
            <div id="footerContainer">
                <div id="profilePic">
                    <a href="https://www.sololearn.com/Profile/100073"><img id="theImg" src="https://blob.sololearn.com/avatars/4f502f80-c497-49f5-be5b-3ee1f3be0739.jpg"/></a>
                </div>
                <div id="sig">
                    <p><a href="https://www.sololearn.com/Profile/100073">Jacob</a> &copy; 3/12 (2026). Follow me:&nbsp;</p>
                </div>
                <div id="logos">
                    <a href="https://www.sololearn.com/Profile/100073"><img id="slImg" src="https://blob.sololearn.com/avatars/sololearn.png"/></a>
                    <a href="https://codepen.io/JDawson"><img id="cpenImg" src="https://res.cloudinary.com/css-tricks/images/w_600,h_600,c_fill/f_auto,q_auto/v1637703540/Button-White-Large/Button-White-Large-png?_i=AA"/></a>
                    <a href="https://github.com/Jacob-Dawson"><img id="githubImg" src="https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png"/></a>
                </div>
            </div>
        </div>
    </body>
</html>
